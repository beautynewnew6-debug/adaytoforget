<!DOCTYPE html>
<html>
<head>
  <title>Create Account – Monolith Pictures</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      border: 1px solid #334155;
    }
    .brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand h1 {
      font-size: 22px;
      color: #60a5fa;
      font-weight: 700;
    }
    .brand h2 {
      font-size: 16px;
      color: #e2e8f0;
      margin-top: 6px;
    }
    .brand p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #2563eb;
    }
    .link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #94a3b8;
    }
    .link a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <h1>Monolith Pictures</h1>
      <h2>A Day to Forget</h2>
      <p>Investor Account Registration</p>
    </div>

    <form action="/register" method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" required placeholder="Enter your phone number">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" required>
      </div>
      <div class="form-group">
        <label>Investor ID Number</label>
        <input type="text" name="investor_id" required placeholder="Enter your Investor ID">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Create a password">
      </div>
      <button type="submit">Create Account</button>
    </form>

    <div class="link">
      Already have an account? <a href="/">Login here</a>
    </div>
  </div>
</body>
</html>
